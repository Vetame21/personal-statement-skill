name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # uv provides interpreters that the runner image no longer ships (e.g. 3.9 on Ubuntu 26.04)
        python-version: ['3.9', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: uv run --no-project --with pyyaml python -m unittest discover -s tests -v
      - name: Build is up to date
        run: uv run --no-project --with pyyaml python scripts/build.py --check
